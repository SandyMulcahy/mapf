[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-gt"
version = "0.1.0"
description = "Decentralised game-theoretic MAPF, benchmarked against centralised planners"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    # Pinned to the exact commit in use, so every environment runs the same POGEMA (2.0.0a).
    "pogema @ git+https://github.com/Cognitive-AI-Systems/pogema@91bbceea20ab5e7fbb44727abb00209bbc759147",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
