[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mapf-gt"
version = "0.1.0"
description = "Decentralised game-theoretic MAPF, benchmarked against centralised planners"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pogema>=1.4",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
